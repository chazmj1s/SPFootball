name: Production CI/CD Deployment Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Sync Files to Production Directory
        run: |
          mkdir -p ~/football-stack/src
          rsync -av --delete ./ ~/football-stack/src/

      - name: Build and Launch Updated Stack
        run: |
          cd ~/football-stack
          docker compose up --build -d